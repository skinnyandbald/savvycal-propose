name: Keep Supabase Alive

on:
  schedule:
    # Run Monday and Thursday at 9 AM UTC to prevent 7-day inactivity pause
    - cron: "0 9 * * 1,4"
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent pausing
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/?limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Response status: $response"
          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "::error::Supabase ping failed with status $response"
            exit 1
          fi
          echo "Supabase ping successful"
